name: fund-radar

services:
  postgres:
    image: postgres:16.11-bookworm
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      FUND_CORE_DB_NAME: ${FUND_CORE_DB_NAME}
      FUND_CORE_DB_USER: ${FUND_CORE_DB_USER}
      FUND_CORE_DB_PASSWORD: ${FUND_CORE_DB_PASSWORD}
      FUND_AI_DB_NAME: ${FUND_AI_DB_NAME}
      FUND_AI_DB_USER: ${FUND_AI_DB_USER}
      FUND_AI_DB_PASSWORD: ${FUND_AI_DB_PASSWORD}
    volumes:
      - fund_radar_postgres_data:/var/lib/postgresql/data
      - ./postgres/init/01-create-service-databases.sh:/docker-entrypoint-initdb.d/01-create-service-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - fund_radar_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  fund_radar_postgres_data:
  fund_radar_redis_data:
